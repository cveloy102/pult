name: Release Android
on:
  push:
    tags: ['android-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release version and signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure Android release signing secrets first.'; exit 1; }
          VERSION="${GITHUB_REF_NAME#android-v}"
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || exit 1
          MAJOR=$((10#${BASH_REMATCH[1]})); MINOR=$((10#${BASH_REMATCH[2]})); PATCH=$((10#${BASH_REMATCH[3]}))
          (( MAJOR < 2000 && MINOR < 1000 && PATCH < 1000 )) || exit 1
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          (( CODE > 0 && CODE < 2100000000 )) || exit 1
          echo "PULT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PULT_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/pult-release.jks"
      - name: Build signed APK
        working-directory: android
        env:
          PULT_KEYSTORE: ${{ runner.temp }}/pult-release.jks
          PULT_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PULT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PULT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:lintRelease :app:assembleRelease -PversionName="$PULT_VERSION" -PversionCode="$PULT_VERSION_CODE"
      - name: Publish only Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/pult-android-$PULT_VERSION.apk"
          printf '{"component":"android","version":"%s","protocol":1,"minAndroidApi":31}\n' "$PULT_VERSION" > release/compatibility.json
          (cd release && sha256sum *.apk compatibility.json > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" release/* --title "Пульт Android $PULT_VERSION" --generate-notes
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pult-release.jks"

