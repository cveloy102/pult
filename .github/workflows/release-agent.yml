name: Release Windows Agent
on:
  push:
    tags: ['agent-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^agent-v',''
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected agent-vX.Y.Z' }
          "PULT_VERSION=$releaseVersion" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - run: dotnet run --project agent/Pult.Tests/Pult.Tests.csproj --configuration Release
      - name: Publish portable agent with runtime
        run: dotnet publish agent/Pult.Agent/Pult.Agent.csproj --configuration Release --runtime win-x64 --self-contained true -p:Version=${{ env.PULT_VERSION }} --output artifacts/agent
      - name: Create package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item docs/agent-start.txt artifacts/agent/README.txt
          Compress-Archive -Path artifacts/agent/* -DestinationPath "release/pult-agent-$env:PULT_VERSION-win-x64.zip"
          @{ component='agent'; version=$env:PULT_VERSION; protocol=1; minimumWindows='10'; architecture='x64' } | ConvertTo-Json | Set-Content release/compatibility.json -Encoding utf8
          Get-ChildItem release -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - name: Publish only Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem release -File).FullName --title "Пульт Windows $env:PULT_VERSION" --generate-notes
